name: Publish wiki

# Manual-only until the "wiki goes public" roadmap item: Pages isn't enabled
# on the private repo, so a push trigger would fail on every commit.
# When publishing: enable Pages (Settings → Pages → GitHub Actions) and
# restore the push trigger:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
